<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<title>Avatar · BOSS</title>
<link rel="stylesheet" href="assets/tokens.css" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body data-page="avatar">
<div class="app">
  <aside class="sidebar"></aside>
  <main class="main">
    <header class="page-header">
      <div class="eyebrow">Components</div>
      <h1>Avatar</h1>
      <p>Tiga jenis: inisial, foto, dan generic. Tujuh ukuran dari 16px sampai 64px.</p>
    </header>
    <div class="content">
      <section class="section">
        <h2>Ukuran</h2>
        <div class="section-divider"></div>
        <div class="preview">
          <div class="row" style="align-items:flex-end; gap:24px" id="sizes"></div>
        </div>
      </section>

      <section class="section">
        <h2>Jenis</h2>
        <div class="section-divider"></div>
        <div class="preview">
          <div class="row" style="gap:32px; align-items:center">
            <div class="col" style="align-items:center"><div class="avatar" style="width:56px;height:56px;font-size:18px">EA</div><div class="muted" style="font-size:12px">Inisial</div></div>
            <div class="col" style="align-items:center"><div class="avatar" style="width:56px;height:56px; background:var(--primary-700); font-size:18px">RD</div><div class="muted" style="font-size:12px">Inisial (alt)</div></div>
            <div class="col" style="align-items:center"><div class="avatar" style="width:56px;height:56px; background:var(--slate-200); color:var(--slate-500); font-size:24px">●</div><div class="muted" style="font-size:12px">Generic</div></div>
          </div>
        </div>
      </section>

      <section class="section">
        <h2>Group / Stack</h2>
        <div class="section-divider"></div>
        <div class="preview">
          <div class="row" style="gap:0">
            <div class="avatar" style="width:36px;height:36px;font-size:13px">EA</div>
            <div class="avatar" style="width:36px;height:36px;font-size:13px;background:var(--primary-600);margin-left:-10px">RD</div>
            <div class="avatar" style="width:36px;height:36px;font-size:13px;background:var(--positive-600);margin-left:-10px">SP</div>
            <div class="avatar" style="width:36px;height:36px;font-size:12px;background:var(--slate-100);color:var(--slate-600);margin-left:-10px">+5</div>
          </div>
        </div>
      </section>

      <section class="section">
        <h2>Kode</h2>
        <div class="section-divider"></div>
        <pre class="code">&lt;<span class="k">div</span> <span class="k">class</span>=<span class="s">"avatar"</span>&gt;EA&lt;/<span class="k">div</span>&gt;</pre>
      </section>
    </div>
  </main>
</div>
<script src="assets/shell.js"></script>
<script>
const sizes = [16, 20, 24, 32, 40, 56, 64];
document.getElementById('sizes').innerHTML = sizes.map(s => `<div class="col" style="align-items:center"><div class="avatar" style="width:${s}px;height:${s}px;font-size:${Math.max(8, Math.round(s*0.36))}px">EA</div><div class="muted" style="font-size:11px">${s}px</div></div>`).join('');
</script>
</body>
</html>
