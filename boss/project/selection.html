<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<title>Selection · BOSS</title>
<link rel="stylesheet" href="assets/tokens.css" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body data-page="selection">
<div class="app">
  <aside class="sidebar"></aside>
  <main class="main">
    <header class="page-header">
      <div class="eyebrow">Components</div>
      <h1>Selection</h1>
      <p>Checkbox, radio, dan switch — semua interaktif. Klik untuk mengubah state.</p>
    </header>
    <div class="content">
      <section class="section">
        <h2>Checkbox</h2>
        <div class="section-divider"></div>
        <div class="preview">
          <div class="col">
            <label class="row" style="gap:10px"><span class="check checked toggle-check">✓</span><span>Verifikasi data nasabah</span></label>
            <label class="row" style="gap:10px"><span class="check toggle-check"></span><span>Verifikasi dokumen</span></label>
            <label class="row" style="gap:10px"><span class="check checked toggle-check">✓</span><span>Notifikasi email</span></label>
          </div>
        </div>
      </section>

      <section class="section">
        <h2>Radio</h2>
        <div class="section-divider"></div>
        <div class="preview">
          <div class="row" style="gap:24px" id="radioGroup">
            <label class="row" style="gap:10px"><span class="radio checked" data-rb="a"></span><span>DDS 1</span></label>
            <label class="row" style="gap:10px"><span class="radio" data-rb="a"></span><span>DDS 2</span></label>
            <label class="row" style="gap:10px"><span class="radio" data-rb="a"></span><span>DDS 3</span></label>
          </div>
        </div>
      </section>

      <section class="section">
        <h2>Switch</h2>
        <div class="section-divider"></div>
        <div class="preview">
          <div class="col">
            <label class="row" style="gap:10px"><span class="switch on toggle-switch"></span><span>Notifikasi push</span></label>
            <label class="row" style="gap:10px"><span class="switch toggle-switch"></span><span>Sinkronisasi otomatis</span></label>
            <label class="row" style="gap:10px"><span class="switch on toggle-switch"></span><span>Mode offline</span></label>
          </div>
        </div>
      </section>

      <section class="section">
        <h2>Kode</h2>
        <div class="section-divider"></div>
        <pre class="code">&lt;<span class="k">span</span> <span class="k">class</span>=<span class="s">"check checked"</span>&gt;✓&lt;/<span class="k">span</span>&gt;
&lt;<span class="k">span</span> <span class="k">class</span>=<span class="s">"radio checked"</span>&gt;&lt;/<span class="k">span</span>&gt;
&lt;<span class="k">span</span> <span class="k">class</span>=<span class="s">"switch on"</span>&gt;&lt;/<span class="k">span</span>&gt;</pre>
      </section>
    </div>
  </main>
</div>
<script src="assets/shell.js"></script>
<script>
document.querySelectorAll('.toggle-check').forEach(el => {
  el.addEventListener('click', () => { el.classList.toggle('checked'); el.textContent = el.classList.contains('checked') ? '✓' : ''; });
});
document.querySelectorAll('.toggle-switch').forEach(el => {
  el.addEventListener('click', () => el.classList.toggle('on'));
});
document.querySelectorAll('[data-rb]').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll(`[data-rb="${el.dataset.rb}"]`).forEach(r => r.classList.remove('checked'));
    el.classList.add('checked');
  });
});
</script>
</body>
</html>
